name: Revivn
description: >-
  Revivn provides an integrated hardware lifecycle platform for managing
  end-of-life IT equipment. The company handles secure device pickup, certified
  data sanitization and destruction, and redistribution of usable hardware to
  underserved communities through nonprofit partnerships. Its software surface
  (the Revivn App at app.revivn.com) lets IT and asset-management teams schedule
  retrievals, track chain-of-custody, generate compliance and sustainability
  reporting, and — per Revivn's marketing — integrate Revivn's API with their IT
  software stack for customized workflows. No public developer portal, API
  reference, OpenAPI, or SDK is published; the integration API appears to be a
  private, enterprise-only surface. Revivn is a 500 Global portfolio company.
